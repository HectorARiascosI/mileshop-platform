name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: release-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma clients
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate Compose
        run: docker compose -f infra/docker-compose.yml config

      - name: Start local stack for smoke validation
        shell: bash
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 120
          pwsh -File ./scripts/deploy-local-databases.ps1
          export NOTIFICATION_SENDER_MODE=log
          export ORDERS_INTERNAL_TOKEN=ci-local-orders-token
          export CATALOG_RESERVATION_TOKEN=ci-local-catalog-reservation-token

          PORT=3040 DATABASE_URL='postgresql://identity:identity@localhost:5436/identity?schema=public' JWT_SECRET='ci-local-dev-secret-change-in-prod' JWT_EXPIRES_IN='15m' REFRESH_TOKEN_EXPIRES_DAYS='30' ALLOWED_ORIGINS='http://localhost:3001' npm run start --workspace @mileshop/identity-service > /tmp/mileshop-identity.log 2>&1 &
          PORT=3020 DATABASE_URL='postgresql://catalog:catalog@localhost:5434/catalog?schema=public' npm run start --workspace @mileshop/catalog-service > /tmp/mileshop-catalog.log 2>&1 &
          PORT=3010 DATABASE_URL='postgresql://notifications:notifications@localhost:5433/notifications?schema=public' npm run start --workspace @mileshop/notification-worker > /tmp/mileshop-notification.log 2>&1 &
          PORT=3030 DATABASE_URL='postgresql://orders:orders@localhost:5435/orders?schema=public' CATALOG_SERVICE_URL='http://127.0.0.1:3020' npm run start --workspace @mileshop/orders-service > /tmp/mileshop-orders.log 2>&1 &
          PORT=3000 CATALOG_SERVICE_URL='http://127.0.0.1:3020' NOTIFICATION_WORKER_URL='http://127.0.0.1:3010' ORDERS_SERVICE_URL='http://127.0.0.1:3030' IDENTITY_SERVICE_URL='http://127.0.0.1:3040' npm run start --workspace @mileshop/api-gateway > /tmp/mileshop-gateway.log 2>&1 &

          for url in http://localhost:3040/healthz http://localhost:3020/healthz http://localhost:3010/healthz http://localhost:3030/healthz http://localhost:3000/healthz; do
            for i in $(seq 1 60); do
              curl -fsS "$url" && break || sleep 2
            done
            curl -fsS "$url" || {
              echo "::error::Service health check failed: $url"
              for log in /tmp/mileshop-*.log; do
                echo "::group::$log"
                cat "$log"
                echo "::endgroup::"
              done
              exit 1
            }
          done

      - name: Validate local purchase flow
        shell: pwsh
        run: pwsh -File ./scripts/verify-local-purchase.ps1

      - name: Dump local service logs
        if: failure()
        shell: bash
        run: |
          for log in /tmp/mileshop-*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
